<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1726">
<title>TVS Asset Log</title>
<link rel="icon" href="img/icon-32.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>
:root { --ink: #0b1220; --ink-2: #1e293b; --muted: #64748b; --line: #e2e8f0; --line-2: #cbd5e1; --bg: #f3f6fa;
  --brand: #0f766e; --brand-600: #0d9488; --brand-50: #f0fdfa; --navy: #0b1726; --navy-2: #102a3a; --gen: #b45309;
  --red: #dc2626; --red-bg: #fef2f2; --orange: #d97706; --orange-bg: #fffbeb; --green: #15803d; --green-bg: #f0fdf4;
  --shadow: 0 1px 2px rgba(15,23,42,.05), 0 4px 16px rgba(15,23,42,.06); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
header { background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; padding: 14px 16px 18px; }
.top { display: flex; align-items: center; gap: 10px; max-width: 560px; margin: 0 auto; }
.top img { height: 22px; filter: brightness(0) invert(1); }
.top b { font-size: 17px; }
.top small { display: block; color: #94a3b8; font-size: 12px; font-weight: 500; }
.top .sp { flex: 1; }
.lock { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #e2e8f0; border-radius: 10px; padding: 6px 10px; font-size: 13px; }
.demo { background: #f59e0b; color: #1f1300; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 800; margin-left: 6px; }
main { max-width: 560px; margin: 0 auto; padding: 14px 14px 60px; }
.card { background: #fff; border-radius: 14px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h2 { margin: 0 0 10px; font-size: 17px; }
.last { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.last .big { font-size: 32px; font-weight: 800; letter-spacing: -.5px; }
.badge { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
.badge.ok { background: var(--green-bg); color: var(--green); }
.badge.due { background: var(--orange-bg); color: var(--orange); }
.big-btns { display: grid; gap: 12px; }
.big-btn { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; border-radius: 14px; padding: 18px 16px; text-align: left; color: #fff; background: var(--brand); box-shadow: var(--shadow); }
.big-btn.fuel { background: var(--gen); }
.big-btn svg { width: 30px; height: 30px; flex: none; }
.big-btn b { display: block; font-size: 18px; }
.big-btn small { display: block; opacity: .85; font-size: 13.5px; }
label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
input[type=text], input[type=number], input[type=date], input[type=password], textarea {
  width: 100%; padding: 12px; border: 1.5px solid var(--line-2); border-radius: 10px; outline: none; background: #fff; font-size: 17px; }
input:focus, textarea:focus { border-color: var(--brand-600); box-shadow: 0 0 0 4px rgba(13,148,136,.15); }
input.num { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
textarea { min-height: 64px; font-size: 15px; }
.btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 700; background: var(--brand); color: #fff; width: 100%; margin-top: 14px; font-size: 17px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: #fff; color: var(--ink-2); border: 1.5px solid var(--line-2); }
.btn.fuel { background: var(--gen); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 2px dashed var(--line-2); background: #f8fafc; border-radius: 14px; padding: 22px 12px; font-weight: 700; color: var(--ink-2); }
.photo-btn svg { width: 26px; height: 26px; }
.preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; background: #0b1220; display: block; margin-top: 10px; }
.ai { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--brand-50); color: #134e4a; font-size: 14.5px; }
.ai.warn { background: var(--orange-bg); color: #7c2d12; }
.ai.bad { background: var(--red-bg); color: #7f1d1d; }
.spin { display: inline-block; width: 15px; height: 15px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.err { color: var(--red); margin-top: 10px; font-size: 14.5px; min-height: 1px; }
.done-box { text-align: center; padding: 26px 16px; }
.done-box .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--green-bg); color: var(--green); display: grid; place-items: center; margin: 0 auto 10px; }
.done-box .tick svg { width: 34px; height: 34px; }
.list { margin: 0; padding: 0; list-style: none; font-size: 14.5px; }
.list li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list li span:first-child { color: var(--muted); min-width: 92px; }
.list li b { margin-left: auto; white-space: nowrap; }
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px 16px; background: var(--navy); }
.login form { width: 100%; max-width: 340px; background: #fff; border-radius: 18px; padding: 26px 22px; text-align: center; }
.login img { height: 30px; }
.login h1 { font-size: 19px; margin: 12px 0 2px; }
.login input { text-align: center; letter-spacing: 8px; font-size: 22px; margin-top: 16px; }
a.back { color: var(--brand); font-weight: 600; text-decoration: none; display: inline-block; margin-bottom: 8px; }
</style>
</head>
<body>

<section class="login hidden" id="loginView">
  <form id="loginForm" autocomplete="off">
    <img src="img/tvs-logo.png" alt="TVS">
    <h1>Asset Log</h1>
    <div class="muted">Technician PIN</div>
    <input id="pin" type="password" inputmode="numeric" maxlength="12" aria-label="PIN">
    <button class="btn" id="loginBtn">Open</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="appView" class="hidden">
  <header>
    <div class="top">
      <img src="img/tvs-logo.png" alt="TVS">
      <div><b>Asset Log</b><span id="demoPill"></span><small>Horana · Standby generator</small></div>
      <div class="sp"></div>
      <button class="lock" id="lockBtn">Log out</button>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <div id="homeView">
      <div class="card">
        <h2 id="genName">Generator</h2>
        <div class="last"><span class="big" id="lastHours">…</span><span class="muted" id="lastWhen"></span></div>
        <div style="margin-top:8px" id="todayBadge"></div>
      </div>
      <div class="card" id="nameCard">
        <label for="byName" style="margin-top:0">Your name</label>
        <input id="byName" type="text" maxlength="40" placeholder="e.g. Hirushan" autocomplete="name">
      </div>
      <div class="big-btns">
        <button class="big-btn" id="goReading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span><b>Daily hour reading</b><small>Photo of the meter, then check the number</small></span>
        </button>
        <button class="big-btn fuel" id="goFuel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h14M8 8h4M15 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg>
          <span><b>Diesel refill</b><small>Litres filled and the hour meter</small></span>
        </button>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Recent entries</h2>
        <ul class="list" id="recent"><li class="muted">Loading…</li></ul>
      </div>
    </div>

    <!-- READING -->
    <div id="readingView" class="hidden">
      <a href="#" class="back" data-home>‹ Back</a>
      <div class="card">
        <h2>Daily hour reading</h2>
        <input type="file" id="readPhoto" accept="image/*" capture="environment" class="hidden">
        <button type="button" class="photo-btn" id="readPhotoBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span id="readPhotoLabel">Take photo of the hour meter</span>
        </button>
        <img class="preview hidden" id="readPreview" alt="Meter photo">
        <div class="ai hidden" id="readAi"></div>
        <label for="readHours">Hour meter (h)</label>
        <input class="num" id="readHours" type="number" inputmode="decimal" step="0.1" min="0" placeholder="e.g. 1283.5">
        <label for="readStarts">Starts <span class="muted" style="font-weight:400">(if shown)</span></label>
        <input id="readStarts" type="number" inputmode="numeric" step="1" min="0">
        <div class="ai warn hidden" id="readCheck"></div>
        <label for="readNote">Note <span class="muted" style="font-weight:400">(optional)</span></label>
        <textarea id="readNote" maxlength="300" placeholder="Anything unusual? Ran for a power cut, alarm, leak…"></textarea>
        <button class="btn" id="readSave">Save reading</button>
        <div class="err" id="readErr"></div>
      </div>
    </div>

    <!-- FUEL -->
    <div id="fuelView" class="hidden">
      <a href="#" class="back" data-home>‹ Back</a>
      <div class="card">
        <h2>Diesel refill</h2>
        <div class="row2">
          <div><label for="fuelDate" style="margin-top:0">Date</label><input id="fuelDate" type="date"></div>
          <div><label for="fuelLitres" style="margin-top:0">Litres filled</label><input class="num" id="fuelLitres" type="number" inputmode="decimal" step="0.1" min="0" placeholder="200"></div>
        </div>
        <label for="fuelHours">Hour meter at refill (h)</label>
        <input class="num" id="fuelHours" type="number" inputmode="decimal" step="0.1" min="0" placeholder="e.g. 1283.5">
        <label>Photo <span class="muted" style="font-weight:400">(optional: meter, receipt or tank gauge)</span></label>
        <input type="file" id="fuelPhoto" accept="image/*" capture="environment" class="hidden">
        <button type="button" class="photo-btn" id="fuelPhotoBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span id="fuelPhotoLabel">Add photo</span>
        </button>
        <img class="preview hidden" id="fuelPreview" alt="Refill photo">
        <label for="fuelNote">Note <span class="muted" style="font-weight:400">(optional)</span></label>
        <textarea id="fuelNote" maxlength="300" placeholder="Supplier, bowser, anything unusual…"></textarea>
        <button class="btn fuel" id="fuelSave">Save refill</button>
        <div class="err" id="fuelErr"></div>
      </div>
    </div>

    <!-- DONE -->
    <div id="doneView" class="hidden">
      <div class="card done-box">
        <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
        <h2 id="doneTitle">Saved</h2>
        <div class="muted" id="doneText"></div>
        <button class="btn" data-home>Done</button>
      </div>
    </div>
  </main>
</div>

<script>
/* ===================================================================
 * TVS Asset Log - technician page. Holds no data and no PIN; everything
 * goes to the PIN-protected Command Centre API. ?demo = made-up figures.
 * =================================================================== */
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycby2YHKj2IKHzHQlTRYiczrS3CUVYMSLFWknrTf9VzLK28LuTq9OofduBTPJBVT2KDM-pA/exec',
  TECH_KEY: 'tvsAssetToken', OWNER_KEY: 'tvsCmdToken', NAME_KEY: 'tvsAssetName',
  PHOTO_MAX: 1600, PHOTO_Q: 0.82
};
var DEMO = new URLSearchParams(location.search).has('demo') || !CONFIG.API_URL;
var $ = function (id) { return document.getElementById(id); };
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
var state = { home: null, readPhoto: '', aiHours: null, fuelPhoto: '' };

function token() { return store.get(CONFIG.TECH_KEY) || store.get(CONFIG.OWNER_KEY); }

function api(action, data) {
  if (DEMO) return Demo.call(action, data || {});
  var body = Object.assign({ action: action, token: token() }, data || {});
  return fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) {
        if (j.auth) { store.del(CONFIG.TECH_KEY); showLogin(); }
        throw new Error(j.error || 'Request failed');
      }
      return j.data;
    }, function () { throw new Error('No connection. Check the phone\'s data / Wi-Fi and try again.'); });
}

/* ---------------- login ---------------- */
function showLogin() { $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden'); $('pin').focus(); }
$('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  api('techLogin', { pin: $('pin').value }).then(function (r) {
    store.set(CONFIG.TECH_KEY, r.token); $('pin').value = ''; boot();
  }).catch(function (err) { $('loginErr').textContent = err.message; })
    .then(function () { $('loginBtn').disabled = false; });
});
$('lockBtn').addEventListener('click', function () {
  if (!confirm('Log out of the Asset Log on this phone?')) return;
  store.del(CONFIG.TECH_KEY); showLogin();
});

function boot() {
  if (!DEMO && !token()) return showLogin();
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  $('demoPill').innerHTML = DEMO ? '<span class="demo">DEMO</span>' : '';
  $('byName').value = store.get(CONFIG.NAME_KEY) || '';
  show('homeView'); loadHome();
}

/* ---------------- views ---------------- */
function show(id) {
  ['homeView', 'readingView', 'fuelView', 'doneView'].forEach(function (v) { $(v).classList.toggle('hidden', v !== id); });
  window.scrollTo(0, 0);
}
document.addEventListener('click', function (e) {
  if (e.target.closest('[data-home]')) { e.preventDefault(); show('homeView'); loadHome(); }
});

function loadHome() {
  api('techHome').then(function (h) {
    state.home = h;
    $('genName').textContent = h.name || 'Generator';
    $('lastHours').textContent = h.last ? fmtH(h.last.hours) + ' h' : 'No reading yet';
    $('lastWhen').textContent = h.last ? 'last reading ' + niceDate(h.last.date) + (h.last.time ? ' ' + h.last.time : '') + (h.last.by ? ' · ' + h.last.by : '') : '';
    $('todayBadge').innerHTML = h.doneToday ? '<span class="badge ok">✓ Today\'s reading is done</span>' : '<span class="badge due">Today\'s reading is due</span>';
    var rows = (h.readings || []).map(function (r) { return { d: r.date, t: r.time, txt: 'Reading' + (r.by ? ' · ' + esc(r.by) : ''), v: fmtH(r.hours) + ' h' }; })
      .concat((h.refills || []).map(function (f) { return { d: f.date, t: '', txt: 'Diesel' + (f.hours != null ? ' at ' + fmtH(f.hours) + ' h' : '') + (f.exclude ? ' (not counted)' : ''), v: fmtN(f.litres) + ' L' }; }))
      .sort(function (a, b) { return (b.d + b.t).localeCompare(a.d + a.t); }).slice(0, 6);
    $('recent').innerHTML = rows.length ? rows.map(function (r) { return '<li><span>' + niceDate(r.d) + '</span><span>' + r.txt + '</span><b>' + r.v + '</b></li>'; }).join('') : '<li class="muted">Nothing yet.</li>';
  }).catch(function (err) { $('lastHours').textContent = '—'; $('lastWhen').textContent = err.message; });
}

function needName() {
  var n = $('byName').value.trim();
  if (!n) { show('homeView'); $('byName').focus(); alert('Type your name first.'); return ''; }
  store.set(CONFIG.NAME_KEY, n); return n;
}

/* ---------------- daily reading ---------------- */
$('goReading').addEventListener('click', function () {
  if (!needName()) return;
  state.readPhoto = ''; state.aiHours = null;
  ['readHours', 'readStarts', 'readNote'].forEach(function (id) { $(id).value = ''; });
  $('readPreview').classList.add('hidden'); $('readAi').classList.add('hidden'); $('readCheck').classList.add('hidden');
  $('readPhotoLabel').textContent = 'Take photo of the hour meter'; $('readErr').textContent = '';
  show('readingView');
});
$('readPhotoBtn').addEventListener('click', function () { $('readPhoto').click(); });
$('readPhoto').addEventListener('change', function () {
  var f = this.files && this.files[0]; this.value = '';
  if (!f) return;
  shrink(f).then(function (b64) {
    state.readPhoto = b64;
    $('readPreview').src = 'data:image/jpeg;base64,' + b64; $('readPreview').classList.remove('hidden');
    $('readPhotoLabel').textContent = 'Take the photo again';
    var ai = $('readAi'); ai.className = 'ai'; ai.innerHTML = '<span class="spin"></span>Reading the meter…';
    return api('genReadPhoto', { photo: b64 }).then(function (r) {
      if (r.hours == null) {
        ai.className = 'ai warn';
        ai.textContent = 'Could not read the hours from this photo' + (r.seen ? ' (' + r.seen + ')' : '') + '. Type the number from the meter, or take a clearer photo.';
        return;
      }
      state.aiHours = r.hours;
      $('readHours').value = r.hours;
      if (r.starts != null) $('readStarts').value = r.starts;
      ai.className = r.confidence === 'high' ? 'ai' : 'ai warn';
      ai.innerHTML = 'AI read <b>' + fmtH(r.hours) + ' h</b>' + (r.starts != null ? ' · ' + r.starts + ' starts' : '') + '. ' +
        (r.confidence === 'high' ? 'Check it matches the meter.' : '<b>Not sure, please check every digit.</b>');
      checkReading();
    }).catch(function (err) { ai.className = 'ai warn'; ai.textContent = err.message + ' Type the number from the meter.'; });
  }).catch(function () { $('readErr').textContent = 'Could not open that photo. Try again.'; });
});
$('readHours').addEventListener('input', checkReading);

/** Warns before saving when the number looks wrong (the server checks again). */
function checkReading() {
  var box = $('readCheck'), v = Number($('readHours').value), last = state.home && state.home.last;
  box.classList.add('hidden');
  if (!last || $('readHours').value === '' || !isFinite(v)) return;
  if (v < last.hours) { box.className = 'ai bad'; box.innerHTML = '<b>Lower than the last reading</b> (' + fmtH(last.hours) + ' h, ' + niceDate(last.date) + '). Check the number. If the meter really changed, write why in the note.'; }
  else if (v - last.hours > 48) { box.className = 'ai warn'; box.innerHTML = '<b>' + fmtH(v - last.hours) + ' h more</b> than the last reading (' + fmtH(last.hours) + ' h, ' + niceDate(last.date) + '). Please check the number.'; }
  else return;
}
$('readSave').addEventListener('click', function () {
  var by = needName(); if (!by) return;
  $('readErr').textContent = '';
  if ($('readHours').value === '') { $('readErr').textContent = 'Type the hour-meter reading.'; return; }
  if (!state.readPhoto && !$('readNote').value.trim()) { $('readErr').textContent = 'Take a photo of the meter (or write in the note why there is none).'; return; }
  var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Saving…';
  api('genSaveReading', { hours: $('readHours').value, starts: $('readStarts').value, aiHours: state.aiHours, photo: state.readPhoto, note: $('readNote').value, by: by })
    .then(function (r) {
      $('doneTitle').textContent = 'Reading saved: ' + fmtH(r.hours) + ' h';
      $('doneText').textContent = r.since != null ? 'Ran ' + fmtH(r.since) + ' h since the last reading.' : '';
      show('doneView');
    }).catch(function (err) { $('readErr').textContent = err.message; })
    .then(function () { btn.disabled = false; btn.textContent = 'Save reading'; });
});

/* ---------------- diesel refill ---------------- */
$('goFuel').addEventListener('click', function () {
  if (!needName()) return;
  state.fuelPhoto = '';
  ['fuelLitres', 'fuelHours', 'fuelNote'].forEach(function (id) { $(id).value = ''; });
  $('fuelDate').value = isoDay(new Date()); $('fuelDate').max = isoDay(new Date());
  $('fuelPreview').classList.add('hidden'); $('fuelPhotoLabel').textContent = 'Add photo'; $('fuelErr').textContent = '';
  show('fuelView');
});
$('fuelPhotoBtn').addEventListener('click', function () { $('fuelPhoto').click(); });
$('fuelPhoto').addEventListener('change', function () {
  var f = this.files && this.files[0]; this.value = '';
  if (!f) return;
  shrink(f).then(function (b64) {
    state.fuelPhoto = b64;
    $('fuelPreview').src = 'data:image/jpeg;base64,' + b64; $('fuelPreview').classList.remove('hidden');
    $('fuelPhotoLabel').textContent = 'Change photo';
  }).catch(function () { $('fuelErr').textContent = 'Could not open that photo. Try again.'; });
});
$('fuelSave').addEventListener('click', function () {
  var by = needName(); if (!by) return;
  $('fuelErr').textContent = '';
  if (!(Number($('fuelLitres').value) > 0)) { $('fuelErr').textContent = 'Type the litres filled.'; return; }
  if ($('fuelHours').value === '') { $('fuelErr').textContent = 'Type the hour-meter reading at the refill.'; return; }
  var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Saving…';
  api('genSaveFuel', { date: $('fuelDate').value, litres: $('fuelLitres').value, hours: $('fuelHours').value, photo: state.fuelPhoto, note: $('fuelNote').value, by: by })
    .then(function (r) {
      $('doneTitle').textContent = 'Refill saved: ' + fmtN(r.litres) + ' L';
      $('doneText').textContent = niceDate(r.date) + ' at ' + fmtH(r.hours) + ' h.';
      show('doneView');
    }).catch(function (err) { $('fuelErr').textContent = err.message; })
    .then(function () { btn.disabled = false; btn.textContent = 'Save refill'; });
});

/* ---------------- helpers ---------------- */
/** Phone photo -> JPEG base64, longest side PHOTO_MAX px (keeps the digits sharp, upload small). */
function shrink(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var s = Math.min(1, CONFIG.PHOTO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', CONFIG.PHOTO_Q).split(',')[1]);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function isoDay(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function niceDate(k) {
  if (!k) return '';
  var today = isoDay(new Date()), y = new Date(); y.setDate(y.getDate() - 1);
  if (k === today) return 'Today'; if (k === isoDay(y)) return 'Yesterday';
  return new Date(k + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function fmtH(n) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function fmtN(n) { return Number(n).toLocaleString('en-US', { maximumFractionDigits: 1 }); }

/* ===================================================================
 * Demo mode: made-up figures, nothing is saved.
 * =================================================================== */
var Demo = (function () {
  var today = isoDay(new Date()), y = new Date(); y.setDate(y.getDate() - 1); var yd = isoDay(y);
  var readings = [{ date: yd, time: '08:40', hours: 1001.2, by: 'Demo tech' }, { date: '2026-01-01', time: '', hours: 990.0, by: 'Demo' }];
  var refills = [{ date: yd, litres: 150, hours: 1000.5, exclude: false }];
  function wait(v, ms) { return new Promise(function (r) { setTimeout(function () { r(JSON.parse(JSON.stringify(v))); }, ms || 300); }); }
  function fail(msg) { return new Promise(function (_, rej) { setTimeout(function () { rej(new Error(msg)); }, 300); }); }
  return { call: function (a, p) {
    switch (a) {
      case 'techLogin': return wait({ token: 'demo' });
      case 'techHome': return wait({ name: 'Demo generator · 250 kVA', today: today, last: readings[0], readings: readings, refills: refills, doneToday: readings[0].date === today });
      case 'genReadPhoto': return wait({ hours: Math.round((readings[0].hours + 1.3) * 10) / 10, starts: 512, confidence: 'high', seen: 'controller display' }, 1400);
      case 'genSaveReading': {
        var h = Number(p.hours), last = readings[0];
        if (h < last.hours && !String(p.note || '').trim()) return fail('This is LOWER than the last reading (' + last.hours + ' h). Check the number. If the meter really changed, write why in the note and save again.');
        readings.unshift({ date: today, time: new Date().toTimeString().slice(0, 5), hours: h, by: p.by });
        return wait({ hours: h, since: Math.round((h - last.hours) * 10) / 10 }, 700);
      }
      case 'genSaveFuel': refills.unshift({ date: p.date, litres: Number(p.litres), hours: Number(p.hours) }); return wait({ date: p.date, litres: Number(p.litres), hours: Number(p.hours) }, 700);
      default: return wait(null);
    }
  } };
})();
